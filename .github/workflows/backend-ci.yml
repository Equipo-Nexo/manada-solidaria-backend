name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Give Maven Wrapper execute permission
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw --batch-mode clean compile

      - name: Tests
        run: ./mvnw --batch-mode test