info:
  name: Signup
  type: http
  seq: 2

http:
  method: POST
  url: "{{MANADA_SOLIDARIA_HOST}}/auth/signup"
  body:
    type: json
    data: |-
      {
          "username": "admin",
          "password": "admin",
          "repeatedPassword": "admin",
          "email": "admin@gmail.com",
          "roles": ["COMMUNITY", "CARRIAGE", "TRANSITIONAL_HOME"]
      }

runtime:
  scripts:
    - type: after-response
      code: "const response = res.getBody();\r

        bru.setGlobalEnvVar(\"access_token\", response.accessToken);\r

        bru.setGlobalEnvVar(\"refresh_token\", response.refreshToken);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
