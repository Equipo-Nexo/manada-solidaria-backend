runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.body;

        bru.setEnvVar("access_token", response.accessToken);
        bru.setEnvVar("refresh_token", response.refreshToken);
        bru.setEnvVar("user_id", response.userId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
