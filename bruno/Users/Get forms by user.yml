info:
  name: Get forms by user
  type: http
  seq: 6

http:
  method: GET
  url: "{{MANADA_SOLIDARIA_HOST}}/users/adoption-forms"
  params:
    - name: filter
      value: REVIEWER
      type: query
      disabled: false
    - name: filter
      value: OWNER
      type: query
      disabled: true
    - name: status
      value: PENDING
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.counters
      operator: isDefined
    - expression: res.body.counters.total
      operator: isNumber
    - expression: res.body.counters.pending
      operator: isNumber
    - expression: res.body.counters.reviewed
      operator: isNumber
    - expression: res.body.forms
      operator: isArray

scripts:
  - type: tests
    code: |-
      test("los contadores coinciden con la suma de estados", function () {
        const { total, pending, reviewed } = res.body.counters;
        expect(total).to.equal(pending + reviewed);
      });

      test("cada formulario contiene los campos requeridos", function () {
        const campos = ["id", "animalName", "animalImageUrl", "applicantName", "isRead", "createdAt"];
        res.body.forms.forEach((form) => {
          campos.forEach((campo) => expect(form).to.have.property(campo));
        });
      });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Obtiene los formularios de adopción del usuario autenticado junto con los contadores de estado.

  Parámetros de Consulta (Query Params):
  - `filter` (Obligatorio): `REVIEWER` (recibidos como dueño) o `OWNER` (enviados como postulante).
  - `status` (Opcional): `ALL` (por defecto), `PENDING` (solo no leídos) o `REVIEWED` (solo leídos).

  Estructura de respuesta:
  {
    "counters": {
      "total": 3,
      "pending": 2,
      "reviewed": 1
    },
    "forms": [
      {
        "id": "c1111111-1111-1111-1111-111111111111",
        "animalName": "Firulais",
        "animalImageUrl": "cf-image-1",
        "applicantName": "Juan Pérez",
        "description": "Quiero adoptar a Firulais para darle una buena calidad de vida.",
        "isRead": false,
        "createdAt": "2026-10-07T14:30:00"
      }
    ]
  }