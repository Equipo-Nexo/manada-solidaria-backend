info:
  name: Get user posts
  type: http
  seq: 1

http:
  method: GET
  url: "{{MANADA_SOLIDARIA_HOST}}/users/posts"
  params:
    - name: type
      value: animal
      type: query
      disabled: true
    - name: type
      value: campaign
      type: query
      disabled: true
    - name: type
      value: fundraising
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("cada publicacion conserva los 7 campos que usa Mis publicaciones", function () {
          const campos = ["id", "title", "description", "createdSince", "imageId", "postType", "status"];
          res.body.forEach((post) => campos.forEach((campo) => expect(post).to.have.property(campo)));
        });

        test("no repite el titulo ni la imagen con el nombre de la home", function () {
          res.body.forEach((post) => {
            expect(post).to.not.have.property("name");
            expect(post).to.not.have.property("imageUrl");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Mis publicaciones: las del usuario logueado (el del token), como un array.

  Cada elemento trae SIEMPRE los 7 campos de siempre (los que usa la pantalla "Mis publicaciones"):
  - `id`, `title`, `description`, `imageId`, `status`
  - `createdSince`: dias desde que se publico (0 = hoy)
  - `postType`: animal | campaign | fundraising

  Y ademas los datos de la card de la home, con los mismos nombres que en la home:
  - Todos: `type`, `location`, `phoneNumber`, `ownerId`, `createdAt`
  - Animal: `animal`, `owner`, `reward`
  - Campaña y colecta: `accountAlias`, `amountToBeCollected`, `amountCollected`,
    `campaignEndDate`, `items`, `newsStartDateTime`, `newsEndDateTime`

  El nombre y la imagen del animal vienen en `title` e `imageId` (en la home se llaman `name` e `imageUrl`).

  Vienen de la mas nueva a la mas vieja. Para filtrar, activa el parametro `type`
  (una sola opcion a la vez): animal, campaign o fundraising.

  Como distinguir cada card:
  - Pestañas Animales / Campañas / Colectas: `postType`
  - Animal: `type` = LOST (perdido) | IN_STREET (en la calle) | ADOPTION (adopcion)
  - Campaña: `type` = donation | vaccination | castration | deworming | other
    (las colectas traen `type` = fundraising)

  Para tener datos, corre antes las requests `Create ...` de AnimalPosts y Campaigns
  (con el mismo usuario que hizo el login).

  Ejemplo de animal:
  {
    "id": "d1679b8c-3042-44e2-8e4d-1cb7bec10c8e",
    "title": "Toby",
    "description": "Busca casa",
    "createdSince": 0,
    "imageId": "/fotoToby",
    "postType": "animal",
    "status": "SEARCHING_ADOPT",
    "type": "ADOPTION",
    "location": { "id": "...", "name": "Villa Maria", "address": "San Martin", "number": 100, "latitude": -32.41, "longitude": -63.24 },
    "phoneNumber": { "areaCode": "353", "number": "4010369" },
    "ownerId": "...",
    "createdAt": "2026-09-30T11:35:25.166562",
    "animal": { "id": "...", "type": "DOG", "size": "SMALL", "gender": "MALE", "color": null, "age": "PUPPY" },
    "owner": { "username": "admin", "roles": ["COMMUNITY"], "profileImageURL": null },
    "reward": null
  }

  Ejemplo de colecta:
  {
    "id": "857cbdca-892b-4443-b361-f726e0d0ac41",
    "title": "Ayuda para Michi",
    "description": "Operacion",
    "createdSince": 0,
    "imageId": "/fotoMichi",
    "postType": "fundraising",
    "status": "CREATED",
    "type": "fundraising",
    "location": { "id": "...", "name": "Villa Maria", "address": "San Martin", "number": 100, "latitude": -32.41, "longitude": -63.24 },
    "phoneNumber": { "areaCode": "353", "number": "4010369" },
    "ownerId": "...",
    "createdAt": "2026-09-30T09:07:30.640278",
    "accountAlias": "michi.ayuda",
    "amountToBeCollected": null,
    "amountCollected": 0,
    "campaignEndDate": "2030-12-31",
    "items": null,
    "newsStartDateTime": null,
    "newsEndDateTime": null
  }

  Esperado: 200. Con `type` distinto de animal, campaign o fundraising: 400. Sin token: 401.
