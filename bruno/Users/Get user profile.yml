info:
  name: Get user profile
  type: http
  seq: 5

http:
  method: GET
  url: "{{MANADA_SOLIDARIA_HOST}}/users/{{user_id}}/profile"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.createdAt
      operator: isString
    - expression: res.body.posts
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Perfil de un usuario + fecha de alta, SIN publicaciones (pensado para "Mi Perfil").

  Por defecto usa `{{user_id}}`, el usuario que hizo el login (corre `Auth/Login` primero).
  Para ver a OTRO usuario, cambia el id de la URL por el suyo (sale de `Users/Get users`).

  Respuesta:
  {
    "id": "...",
    "username": "Abril",
    "profile": {
      "name": "Juan",
      "lastname": "Gomez",
      "email": "abrilconrero@gmail.com",
      "phoneNumber": { "areaCode": "353", "number": "4182076" },
      "profileImageURL": "cf-abril"
    },
    "roles": ["RESCUER", "TRANSITIONAL_HOME"],
    "createdAt": "2026-09-07T10:15:32.412961"
  }

  `createdAt` es la fecha de alta, sin zona horaria. Reemplaza al viejo `daysSinceRegistration`:
  los dias transcurridos los calcula el front.
  Para ver ademas las publicaciones, usa `Users/Get user detail`.

  Esperado: 200, sin el campo `posts`. Sin token: 401.
