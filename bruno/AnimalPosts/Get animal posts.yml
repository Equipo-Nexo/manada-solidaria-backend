info:
  name: Get animal posts
  type: http
  seq: 4

http:
  method: GET
  url: "{{MANADA_SOLIDARIA_HOST}}/animal-posts?type=ADOPTION"
  params:
    - name: type
      value: LOST
      type: query
      disabled: true
    - name: type
      value: ADOPTION
      type: query
    - name: type
      value: IN_STREET
      type: query
      disabled: true
    - name: status
      value: SEARCHING_ADOPT_AND_TRANSIT
      type: query
      disabled: true
    - name: status
      value: SEARCHING_ADOPT
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.content && res.body.content.length > 0) {
          bru.setEnvVar("animal_post_id", res.body.content[0].id);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Guarda el id de la primera publicacion en `animal_post_id` para usarlo en Like / Dislike.

  Cada publicacion trae, ademas de lo de siempre (MS-259):
  - `reactionsCount`: cantidad de likes de la publicacion (numero, `0` si no tiene).
  - `reactedByMe`: `true` si el usuario del token le dio like.

  Los dos campos vienen igual en `GET /animal-posts/{id}`, en la respuesta de `PATCH /animal-posts/{id}/status`
  y en los posts de animales de `GET /users/{userId}` y `GET /users/posts`.

  Esperado: 200. Sin token o token invalido: 401.
