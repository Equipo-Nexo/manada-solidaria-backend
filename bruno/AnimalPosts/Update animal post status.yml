info:
  name: Update animal post status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{MANADA_SOLIDARIA_HOST}}/animal-posts/598566e9-28fe-4218-845b-36c968e78dab/status"
  params:
    - name: type
      value: LOST
      type: query
      disabled: true
    - name: type
      value: INSTREET
      type: query
      disabled: true
    - name: status
      value: SEARCHING_ADOPT_AND_TRANSIT
      type: query
      disabled: true
    - name: status
      value: SEARCHING_ADOPT
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
          "status": "IN_ADOPTION_AND_TRANSIT_PET"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `EXPIRED` (MS-270) lo pone solo el sistema: un cron diario expira las publicaciones abiertas
  que llevan 120 dias sin editarse ni cambiar de estado. Mandarlo a mano devuelve 409, y una publicacion expirada
  ya no puede transicionar a ningun estado (409).

  Notificacion (MS-205): si una adopcion pasa a SEARCHING_ADOPT_AND_TRANSIT (perdio el transito y lo vuelve a buscar)
  se manda un push y una notificacion de campanita "🏠 Un animal necesita hogar de tránsito" a los usuarios con rol
  TRANSITIONAL_HOME, menos al autor. Ninguna otra transicion notifica. La respuesta no cambia (200).
