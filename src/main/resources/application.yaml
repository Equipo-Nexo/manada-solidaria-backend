spring:
  flyway:
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true
    locations: classpath:db/migration
  application:
    name: manada-solidaria-backend
  profiles:
    active: ${SPRING_PROFILE:local}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/manada_solidaria?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  swagger-ui:
    path: /docs
server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
security:
  access-token-expiration: 60
  refresh-token-expiration: 120
  secret: ${SECURITY_KEY}
cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    bucket: ${CLOUDFLARE_R2_BUCKET}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}
clients:
  rest:
    apis:
      geoapify:
        api-key: ${GEOAPIFY_APIKEY}
        host: https://api.geoapify.com
        paths:
          geocode-autocomplete: ${clients.rest.apis.geoapify.host}/v1/geocode/autocomplete
          geocode-reverse: ${clients.rest.apis.geoapify.host}/v1/geocode/reverse?apiKey={apiKey}&lat={latitude}&lon={longitude}
      holidays:
        host: https://api.argentinadatos.com
        paths:
          by-year: ${clients.rest.apis.holidays.host}/v1/feriados/{year}