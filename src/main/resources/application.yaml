spring:
  application:
    name: manada-solidaria-backend
  profiles:
    active: ${SPRING_PROFILE:local}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/manada_solidaria?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  swagger-ui:
    path: /docs
security:
  access-token-expiration: 60
  refresh-token-expiration: 120
  secret: ${SECURITY_KEY}