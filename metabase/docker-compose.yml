services:
  db-metricas:
    image: mysql:8.4
    container_name: db-metricas
    command: --character-set-server=utf8mb4
    ports:
      - "127.0.0.1:${DB_METRICAS_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: manada_solidaria
    volumes:
      - db-metricas-data:/var/lib/mysql
      - ./seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed/seed-metricas.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  metabase:
    image: metabase/metabase:v0.63.18.4
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
      MB_CHECK_FOR_UPDATES: "false"
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - db-metricas

volumes:
  db-metricas-data:
  metabase-data:
